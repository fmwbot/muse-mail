<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Muse Mail은 Gmail의 특정 주소와 관련된 안 읽은 메일 수를 확인하는 개인용 새 메일 알림 도구입니다.">
  <title>Muse Mail — 개인용 Gmail 새 메일 알림 도구</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f4ed; color: #20352c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 960px; margin: auto; padding: 80px 32px; }
    .label { font-size: 14px; letter-spacing: .08em; color: #52685b; }
    h1 { margin: 28px 0 16px; font-size: clamp(54px, 11vw, 112px); font-weight: 650; letter-spacing: -.06em; line-height: 1.08; }
    h2 { margin: 0 0 24px; font-size: clamp(22px, 4vw, 32px); font-weight: 500; letter-spacing: -.04em; }
    p { max-width: 620px; line-height: 1.8; font-size: 18px; }
    section { border-top: 1px solid #ccd4c9; margin-top: 48px; padding-top: 28px; }
    section h2 { font-size: 20px; }
    section p { font-size: 16px; }
    footer { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 48px; }
    a { color: #20352c; text-underline-offset: 5px; }
    a:hover { color: #426b50; }
    a:focus-visible { outline: 2px solid #426b50; outline-offset: 5px; }
    @media (max-width: 480px) { main { padding: 48px 24px; } }
  </style>
</head>
<body>
  <main>
    <div class="label">PERSONAL GMAIL NOTIFICATIONS</div>
    <h1>Muse Mail</h1>
    <h2>개인용 Gmail 새 메일 알림 도구</h2>
    <p>사용자가 지정한 주소와 관련된 안 읽은 메일 수를 자동으로 확인하고, 새 메일을 알아볼 수 있도록 돕습니다.</p>
    <section aria-labelledby="access-title">
      <h2 id="access-title">읽기 전용으로 필요한 수만 확인합니다.</h2>
      <p>Google OAuth를 통해 Gmail 읽기 전용 권한을 사용합니다. 메일 내용을 저장하거나 제3자에게 공유하지 않습니다.</p>
      <p>개인용 도구로 운영되며, 이 홈페이지에서는 로그인이나 메일 조회를 제공하지 않습니다.</p>
    </section>
    <footer>
      <a href="privacy.html">개인정보처리방침</a>
      <a href="mailto:fmwbot@gmail.com">문의: fmwbot@gmail.com</a>
    </footer>
  </main>
</body>
</html>
